# Render Blueprint 配置
# 文档: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: 163music-bot
    runtime: python
    plan: free
    region: singapore
    # 构建命令：安装依赖
    buildCommand: pip install -r requirements.txt
    # 启动命令：运行 Bot（Webhook 模式，由 Render 注入 RENDER_EXTERNAL_URL / PORT）
    startCommand: python bot_v6.2.py
    # 健康检查路径（代码中 GET / 返回 OK）
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # ---- 必填：Upstash Redis ----
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # ---- 必填（或存入 Upstash）：Bot 凭据 ----
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      # ---- 可选 ----
      - key: MUSIC_QUALITY
        value: standard
      - key: PYTHON_VERSION
        value: 3.11.9
